services:
  pdf-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-api
    ports:
      - "8000:8000"
    volumes:
      - ./src/static/tailwind-all.css:/app/src/static/tailwind-all.css
      # - ./temp:/app/temp
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      # OpenTelemetry environment variables
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=${SERVICE_NAMESPACE:-development}
      - OTEL_SERVICE_NAME=pdf-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp.last9.io:443
      - 'OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic c3ByeWhlYWx0aDoyNjA3NTRmZDE5NjQ='
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_SAMPLER=parentbased_always_on
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_LOG_LEVEL=debug
    # restart: unless-stopped
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 6G
    cpus: 2.0 
    shm_size: '1gb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536